services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: photoshare-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: photoshare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CUSTOMER_SESSION_EXPIRE_MINUTES
        value: "720"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BACKEND_BASE_URL
        sync: false

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: photoshare-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: https://photoshare-backend.onrender.com

databases:
  # 3. Managed PostgreSQL Database
  - name: photoshare-db
    plan: free
    databaseName: photoshare
    user: photoshare_user
